name: Release Please

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}

      - uses: actions/checkout@v4
        if: github.ref_name == 'next' && steps.release.outputs.release_created

      - name: Name the server this pre-release was built against
        if: github.ref_name == 'next' && steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          target=$(sed -n '/<!-- next-target -->/,/<!-- \/next-target -->/p' README.md | sed '1d;$d')
          test -n "$target"
          gh release view "$TAG" --json body --jq .body > notes.md
          printf '%s\n\n' "Pre-release for qbrix next. $target" | cat - notes.md > body.md
          gh release edit "$TAG" --notes-file body.md

      - uses: actions/checkout@v4
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@v5
        if: steps.release.outputs.pr

      - name: Update uv.lock
        if: steps.release.outputs.pr
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock"
            git push
          fi

[project]
name = "qbrix"
version = "0.1.6"
description = "Python SDK for the qbrix multi-armed bandit platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Optiq", email = "hello@qbrix.io" }]
keywords = ["bandit", "mab", "experimentation", "optimization", "a/b testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.9.0"]
http2 = ["httpx[http2]>=0.28.1"]
benchmark = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "tqdm>=4.66.0",
]

[project.scripts]
qbrix-mcp = "qbrixmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.1",
    "black>=26.1.0",
    "pytest-mock>=3.14.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
